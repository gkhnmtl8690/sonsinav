name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Cordova
      run: npm install -g cordova@11.1.0
    
    - name: Install dependencies
      working-directory: okul-app
      run: npm install --legacy-peer-deps
    
    - name: Sync www files
      working-directory: okul-app
      run: |
        cp -r ../HTML-CSS-JS-Static/* www/
        rm -f www/server.js www/package*.json
    
    - name: Add Android platform
      working-directory: okul-app
      run: |
        cordova platform rm android || true
        cordova platform add android@10.1.2
    
    - name: Build Debug APK
      working-directory: okul-app
      run: cordova build android --debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: okul-app-debug
        path: okul-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk