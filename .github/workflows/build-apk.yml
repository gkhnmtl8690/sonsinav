name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Use Node.js 16
      uses: actions/setup-node@v4
      with:
        node-version: '16'
        
    - name: Use JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
        
    - name: Install Cordova CLI
      run: npm install -g cordova@10.0.0
      
    - name: Prepare www folder
      run: |
        cp -r HTML-CSS-JS-Static/* okul-app/www/
        rm -f okul-app/www/server.js okul-app/www/package*.json
        
    - name: Build Android APK
      working-directory: okul-app
      run: |
        npm install
        cordova platform rm android
        cordova platform add android@9.1.0
        cordova build android --debug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: okul-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk