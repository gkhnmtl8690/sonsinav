name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'
        cache: 'npm'
        cache-dependency-path: 'okul-app/package-lock.json'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 8512546
        accept-android-sdk-licenses: true
    
    - name: Install Cordova
      run: |
        npm install -g cordova@11.1.0
        cordova telemetry off
    
    - name: Install dependencies
      working-directory: okul-app
      run: |
        npm install --legacy-peer-deps
    
    - name: Sync www files
      working-directory: okul-app
      run: |
        cp -r ../HTML-CSS-JS-Static/* www/
        rm -f www/server.js www/package*.json
    
    - name: Prepare Cordova platform
      working-directory: okul-app
      run: |
        cordova platform add android@10.1.2
    
    - name: Build Debug APK
      working-directory: okul-app
      run: cordova build android --debug
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: okul-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30